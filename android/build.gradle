// Root build file. Plugin versions are pinned in gradle/libs.versions.toml style here
// as plain strings so the wrapper (Gradle 8.11.1) resolves AGP 8.9.2 from google().
plugins {
    id 'com.android.application' version '8.9.2' apply false
    // Kotlin 2.x requires the Compose compiler Gradle plugin at the same Kotlin version:
    // https://developer.android.com/develop/ui/compose/compiler
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
