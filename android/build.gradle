// Root build file. Plugin versions are pinned in gradle/libs.versions.toml style here
// as plain strings so the wrapper (Gradle 8.11.1) resolves AGP 8.9.2 from google().
plugins {
    id 'com.android.application' version '8.9.2' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
